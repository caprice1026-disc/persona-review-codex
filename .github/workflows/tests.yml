name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PERSONA_REVIEW_REQUIRE_SHELL_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and review contract tests (no API keys)
        run: python -m unittest discover -s tests -v
      - name: Validate bundled example
        run: python scripts/persona_review.py validate-review examples/review.json
      - name: Check hand-authored quality contracts (not a model evaluation)
        run: python tests/review_quality.py check tests/fixtures/review_quality/reference-results.json
      - name: Build allowlisted distribution artifacts
        run: python tools/build_dist.py --output dist
      - name: Verify deterministic rebuild
        run: python tools/build_dist.py --output dist --check
